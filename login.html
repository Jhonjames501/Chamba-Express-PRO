<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{font-family:Arial;box-sizing:border-box}body{background:#0f0f0f;color:white;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#1e1e1e;padding:30px;border-radius:25px;width:100%;max-width:400px;border:1px solid #333;text-align:center}
.rol{padding:20px;border:2px solid #333;border-radius:18px;margin:10px 0;cursor:pointer;background:#0f0f0f}
.rol.active{border-color:#00ff88;background:#00ff8822}
.rol h3{margin:5px 0}
.btn{background:#00ff88;color:black;border:none;padding:16px;width:100%;border-radius:15px;font-weight:800;margin-top:20px;font-size:16px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#0f0f0f;color:white;margin-top:15px}
</style></head><body>
<div class="card">
<h1 style="font-size:28px">Chamba<br>Express</h1>
<p style="color:#888">¿Cómo quieres entrar?</p>
<input id="nombre" placeholder="Tu nombre completo">
<div class="rol" id="rolTrab" onclick="elegir('trabajador')">
<h3>🙋‍♂️ Soy Trabajador</h3><small>Busco chambas diarias</small>
</div>
<div class="rol" id="rolEmp" onclick="elegir('empleador')">
<h3>🏢 Soy Empleador</h3><small>Quiero contratar gente</small>
</div>
<button class="btn" onclick="entrar()">ENTRAR A LA APP →</button>
</div>
<script>
let rolElegido='';
function elegir(r){
 rolElegido=r;
 document.querySelectorAll('.rol').forEach(x=>x.classList.remove('active'));
 document.getElementById(r=='trabajador'?'rolTrab':'rolEmp').classList.add('active');
}
function entrar(){
 if(!nombre.value||!rolElegido){alert('Pon tu nombre y elige un rol');return;}
 localStorage.setItem('nombre',nombre.value);
 localStorage.setItem('rol',rolElegido);
 location.href='index.html';
}
</script></body></html>
