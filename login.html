<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Chamba Express</title>
<style>
*{font-family:Arial;box-sizing:border-box}body{background:#0f0f0f;color:white;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#1e1e1e;padding:30px;border-radius:25px;width:100%;max-width:400px;border:1px solid #333;text-align:center}
.rol{padding:18px;border:2px solid #333;border-radius:15px;margin:10px 0;cursor:pointer;background:#0f0f0f;text-align:left;display:flex;gap:12px;align-items:center}
.rol.active{border-color:#00ff88;background:#00ff881a}
.btn{background:#00ff88;color:black;border:none;padding:16px;width:100%;border-radius:15px;font-weight:800;margin-top:20px;font-size:16px}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#0f0f0f;color:white;margin-top:10px}
</style></head><body>
<div class="card">
<h1 style="font-size:30px;line-height:1">💼 Chamba<br>Express</h1>
<p style="color:#888;margin:10px 0">Bienvenido - Elige cómo entras</p>
<input id="nombre" placeholder="Tu nombre completo *">
<input id="whatsapp" placeholder="Tu WhatsApp 9XXXXXXXX *">
<input id="distrito" placeholder="Distrito Ej: SJL">
<div class="rol" id="rolTrab" onclick="elegir('trabajador')"><div style="font-size:28px">🙋‍♂️</div><div><h3 style="margin:0">Soy Trabajador</h3><small style="color:#aaa">Busco chambas y me califican por mi comportamiento</small></div></div>
<div class="rol" id="rolEmp" onclick="elegir('empleador')"><div style="font-size:28px">🏢</div><div><h3 style="margin:0">Soy Empleador</h3><small style="color:#aaa">Publico chambas y califico trabajadores</small></div></div>
<button class="btn" onclick="entrar()">ENTRAR AHORA →</button>
<p style="color:#555;font-size:11px;margin-top:15px">Se guarda en tu celular y podrás cambiar de rol después</p>
</div>
<script>
let rolElegido='';
function elegir(r){rolElegido=r;document.querySelectorAll('.rol').forEach(x=>x.classList.remove('active'));document.getElementById(r=='trabajador'?'rolTrab':'rolEmp').classList.add('active');}
function entrar(){
 if(!nombre.value||!whatsapp.value||!rolElegido){alert('Completa nombre, WhatsApp y elige rol');return;}
 localStorage.setItem('nombre',nombre.value);localStorage.setItem('whatsapp',whatsapp.value);localStorage.setItem('distrito',distrito.value);localStorage.setItem('rol',rolElegido);
 if(rolElegido=='trabajador' && !localStorage.getItem('califs_'+nombre.value)){localStorage.setItem('califs_'+nombre.value, JSON.stringify([{estrellas:'5',empleador:'Chamba Express',texto:'Bienvenido, cuida tu calificación'}]));}
 location.href='index.html';
}
</script></body></html>
