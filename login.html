<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso y Registro - Chamba Express PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .login-card {
            background: #181818; border: 1px solid #333; border-radius: 20px; padding: 24px; width: 100%; max-width: 420px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        .logo-box { width: 55px; height: 55px; background: linear-gradient(135deg, #00b064 0%, #00ff88 100%); border-radius: 14px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 4px 15px rgba(0,255,136,0.3); }
        .title { text-align: center; font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .subtitle { text-align: center; font-size: 12px; color: #888; margin-bottom: 20px; font-weight: 500; }

        .tabs { display: flex; background: #121212; border-radius: 12px; padding: 4px; margin-bottom: 20px; border: 1px solid #333; }
        .tab { flex: 1; text-align: center; padding: 10px; font-size: 13px; font-weight: 700; color: #888; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .tab.active { background: #00ff88; color: #121212; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; color: #b6ff6e; margin-bottom: 4px; font-weight: 700; text-transform: uppercase; }
        .input-box {
            width: 100%; background: #121212; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s;
        }
        .input-box:focus { border-color: #00ff88; box-shadow: 0 0 10px rgba(0,255,136,0.15); }

        .rol-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .rol-option {
            flex: 1; background: #121212; border: 1px solid #333; border-radius: 10px; padding: 12px; text-align: center; cursor: pointer; font-size: 13px; font-weight: 600; color: #888; transition: 0.2s;
        }
        .rol-option.selected { border-color: #00ff88; color: #00ff88; background: #15291f; }

        .btn-submit {
            background: #00ff88; color: #121212; font-weight: 800; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 14px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,255,136,0.2);
        }
        .btn-submit:hover { background: #00cc6a; }
        .footer-text { text-align: center; font-size: 10px; color: #666; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-box">💼</div>
        <h1 class="title">Chamba Express</h1>
        <p class="subtitle">El portal de empleos diarios en Lima</p>

        <div class="tabs">
            <div id="tabReg" class="tab active" onclick="cambiarModo('reg')">Registrarse</div>
            <div id="tabLog" class="tab" onclick="cambiarModo('log')">Iniciar Sesión</div>
        </div>

        <div id="formContainer">
            <!-- Contenido dinámico completo -->
        </div>
        <div class="footer-text">Sistema de Autenticación Local • Chamba Express PRO</div>
    </div>

    <script>
        let modoActual = 'reg';
        let rolSeleccionado = 'Trabajador';

        function cambiarModo(modo) {
            modoActual = modo;
            document.getElementById('tabReg').className = modo === 'reg' ? 'tab active' : 'tab';
            document.getElementById('tabLog').className = modo === 'log' ? 'tab active' : 'tab';
            renderForm();
        }

        function seleccionarRol(rol) {
            rolSeleccionado = rol;
            document.getElementById('btnRolTrabajador').className = rol === 'Trabajador' ? 'rol-option selected' : 'rol-option';
            document.getElementById('rolEmpleador').className = rol === 'Empleador' ? 'rol-option selected' : 'rol-option';
        }

        function renderForm() {
            let container = document.getElementById('formContainer');
            if (modoActual === 'reg') {
                container.innerHTML = `
                    <div class="form-group">
                        <label>Usuario o Correo</label>
                        <input type="text" id="regUser" class="input-box" placeholder="Ej: jhon_lima">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="regPass" class="input-box" placeholder="********">
                    </div>
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" id="regNombre" class="input-box" placeholder="Ej: Jhon Espinoza">
                    </div>
                    <div class="form-group">
                        <label>WhatsApp de Contacto</label>
                        <input type="text" id="regTel" class="input-box" placeholder="912345678">
                    </div>
                    <div class="form-group">
                        <label>Distrito en Lima</label>
                        <input type="text" id="regDistrito" class="input-box" placeholder="Ej: Carabayllo">
                    </div>
                    <div class="form-group">
                        <label>Selecciona tu Rol</label>
                        <div class="rol-selector">
                            <div id="btnRolTrabajador" class="rol-option selected" onclick="seleccionarRol('Trabajador')">👷‍♂️ Trabajador</div>
                            <div id="rolEmpleador" class="rol-option" onclick="seleccionarRol('Empleador')">🏢 Empleador</div>
                        </div>
                    </div>
                    <button class="btn-submit" onclick="registrarUsuario()">CREAR CUENTA</button>
                `;
            } else {
                container.innerHTML = `
                    <div class="form-group">
                        <label>Usuario o Correo</label>
                        <input type="text" id="logUser" class="input-box" placeholder="Ej: Jhon">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="logPass" class="input-box" placeholder="********">
                    </div>
                    <button class="btn-submit" onclick="iniciarSesion()" style="margin-top: 10px;">INGRESAR A LA APP</button>
                `;
            }
        }

        function registrarUsuario() {
            let user = document.getElementById('regUser').value.trim();
            let pass = document.getElementById('regPass').value.trim();
            let nombre = document.getElementById('regNombre').value.trim();
            let tel = document.getElementById('regTel').value.trim();
            let distrito = document.getElementById('regDistrito').value.trim();

            if(!user || !pass || !nombre) {
                alert('Por favor completa los campos principales de registro.');
                return;
            }

            let usuarios = JSON.parse(localStorage.getItem('usuarios_db')) || [];
            
            // Verificamos si el usuario ya existe
            let existe = usuarios.find(u => u.user.toLowerCase() === user.toLowerCase());
            if(existe) {
                alert('⚠️️ Este usuario ya está registrado. Intenta iniciar sesión.');
                cambiarModo('log');
                return;
            }

            usuarios.push({ user, pass, nombre, tel, distrito, rol: rolSeleccionado });
            localStorage.setItem('usuarios_db', JSON.stringify(usuarios));

            // Guardar sesión activa con todos los metadatos completos
            localStorage.setItem('nombre', nombre);
            localStorage.setItem('telefono', tel);
            localStorage.setItem('distrito', distrito);
            localStorage.setItem('rol', rolSeleccionado);
            localStorage.setItem('usuario_activo', user);

            alert('¡Cuenta creada e iniciada con éxito!');
            location.href = 'index.html';
        }

        function iniciarSesion() {
            let user = document.getElementById('logUser').value.trim();
            let pass = document.getElementById('logPass').value.trim();

            if(!user) {
                alert('Por favor ingresa tu usuario.');
                return;
            }

            // ACCESO EXCLUSIVO DE ADMINISTRADOR MASTER (DINÁMICO)
            const adminConfig = JSON.parse(localStorage.getItem('admin_master_config')) || { nombre: 'Jhon', pass: '1234' };
            if(user.toLowerCase() === adminConfig.nombre.toLowerCase()) {
                localStorage.setItem('nombre', adminConfig.nombre);
                localStorage.setItem('telefono', '900000000');
                localStorage.setItem('distrito', 'Carabayllo, Lima');
                localStorage.setItem('rol', 'Administrador Master');
                localStorage.setItem('usuario_activo', adminConfig.nombre);
                alert('👑 ¡Bienvenido, Administrador Master!');
                location.href = 'perfil.html';
                return;
            }

            // Buscar en la base de datos de usuarios normales
            let usuarios = JSON.parse(localStorage.getItem('usuarios_db')) || [];
            let encontrado = usuarios.find(u => u.user.toLowerCase() === user.toLowerCase());

            if(encontrado) {
                localStorage.setItem('nombre', encontrado.nombre);
                localStorage.setItem('telefono', encontrado.tel || 'No registrado');
                localStorage.setItem('distrito', encontrado.distrito || 'Lima');
                localStorage.setItem('rol', encontrado.rol || 'Trabajador');
                localStorage.setItem('usuario_activo', encontrado.user);
                alert(`¡Bienvenido de nuevo, ${encontrado.nombre}!`);
                location.href = 'index.html';
            } else {
                // Registro rápido si es un usuario que viene de versiones anteriores
                localStorage.setItem('nombre', user);
                localStorage.setItem('telefono', 'No registrado');
                localStorage.setItem('distrito', 'Lima');
                localStorage.setItem('rol', 'Trabajador');
                localStorage.setItem('usuario_activo', user);
                alert(`¡Sesión iniciada con éxito como ${user}!`);
                location.href = 'index.html';
            }
        }

        renderForm();
    </script>
</body>
</html>
