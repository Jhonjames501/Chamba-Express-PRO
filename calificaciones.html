<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificaciones y Reputación - Chamba Express</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #121212; color: #ffffff; padding-bottom: 90px; }
        
        .header {
            background: linear-gradient(135deg, #00b064 0%, #00ff88 100%);
            color: #000; padding: 20px;
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .back-btn { background: rgba(0,0,0,0.15); border: none; color: #000; font-weight: 600; padding: 6px 12px; border-radius: 10px; text-decoration: none; font-size: 13px; }
        
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        
        .card {
            background: #181818; border: 1px solid #333; border-radius: 16px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .card h3 { font-size: 16px; font-weight: 700; color: #00ff88; margin-bottom: 12px; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: #b6ff6e; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
        .input-box, textarea, select {
            width: 100%; background: #121212; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; outline: none;
        }
        .input-box:focus, textarea:focus, select:focus { border-color: #00ff88; }
        
        .btn-action {
            background: #00ff88; color: #121212; font-weight: 800; border: none; width: 100%; padding: 12px; border-radius: 10px; font-size: 14px; cursor: pointer; margin-top: 6px;
        }

        .review-item { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
        .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .review-author { font-size: 14px; font-weight: 700; color: #fff; }
        .review-stars { color: #ffc107; font-size: 14px; }
        .review-desc { font-size: 12px; color: #bbb; margin-bottom: 6px; }
        .review-date { font-size: 10px; color: #888; }

        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a1a1a; border-top: 1px solid #2a2a2a; display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-item { text-align: center; color: #888; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: #00ff88; }
        .nav-item svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-top">
            <a href="index.html" class="back-btn">← Volver a la App</a>
            <span style="font-size: 12px; font-weight: 700;">⭐ Reputación</span>
        </div>
        <h1 style="font-size: 20px;">Calificaciones y Reseñas</h1>
    </div>

    <div class="container" style="margin-top: 20px;">
        <!-- Dejar Reseña -->
        <div class="card">
            <h3>✍️ Calificar a un Usuario o Servicio</h3>
            <div class="form-group">
                <label>Nombre del Trabajador / Empleador</label>
                <input type="text" id="nombreCalificado" class="input-box" placeholder="Ej: Carlos Pérez (Gasfitero)">
            </div>
            <div class="form-group">
                <label>Puntuación</label>
                <select id="estrellasCalificacion" class="input-box">
                    <option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐ (Excelente - 5 Estrellas)</option>
                    <option value="⭐⭐⭐⭐">⭐⭐⭐⭐ (Muy Bueno - 4 Estrellas)</option>
                    <option value="⭐⭐⭐">⭐⭐⭐ (Regular - 3 Estrellas)</option>
                    <option value="⭐⭐">⭐⭐ (Malo - 2 Estrellas)</option>
                    <option value="⭐">⭐ (Pésimo - 1 Estrella)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Comentario o Experiencia</label>
                <textarea id="comentarioCalificacion" rows="3" class="input-box" placeholder="Puntual, excelente trabajo y honrado..."></textarea>
            </div>
            <button class="btn-action" onclick="enviarCalificacion()">Publicar Reseña</button>
        </div>

        <!-- Lista de Reseñas -->
        <div class="card">
            <h3>📂 Reseñas Recientes de la Comunidad</h3>
            <div id="listaCalificaciones"></div>
        </div>
    </div>

    <!-- Navegación -->
    <nav class="nav-bar">
        <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Buscar</a>
        <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>Postulaciones</a>
        <a href="mensajes.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>Mensajes</a>
        <a href="perfil.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>Perfil</a>
    </nav>

    <script>
        function enviarCalificacion() {
            const nombre = document.getElementById('nombreCalificado').value.trim();
            const estrellas = document.getElementById('estrellasCalificacion').value;
            const comentario = document.getElementById('comentarioCalificacion').value.trim();
            const autor = localStorage.getItem('nombre') || 'Usuario de la App';

            if(!nombre || !comentario) {
                alert('Por favor completa todos los campos.');
                return;
            }

            let calificaciones = JSON.parse(localStorage.getItem('calificaciones_db')) || [];
            const nuevaReseña = {
                id: Date.now(),
                nombre: nombre,
                estrellas: estrellas,
                comentario: comentario,
                autor: autor,
                fecha: new Date().toLocaleDateString()
            };

            calificaciones.unshift(nuevaReseña);
            localStorage.setItem('calificaciones_db', JSON.stringify(calificaciones));

            document.getElementById('nombreCalificado').value = '';
            document.getElementById('comentarioCalificacion').value = '';

            alert('¡Reseña publicada con éxito!');
            cargarCalificaciones();
        }

        function cargarCalificaciones() {
            let calificaciones = JSON.parse(localStorage.getItem('calificaciones_db')) || [];
            let html = '';

            if(calificaciones.length === 0) {
                html = '<p style="color:#888; font-size:12px; text-align:center;">No hay reseñas registradas aún.</p>';
            } else {
                calificaciones.forEach(r => {
                    html += `
                        <div class="review-item">
                            <div class="review-header">
                                <span class="review-author">👤 ${r.nombre}</span>
                                <span class="review-stars">${r.estrellas}</span>
                            </div>
                            <div class="review-desc">"${r.comentario}"</div>
                            <div class="review-header" style="margin-bottom:0;">
                                <span class="review-date">Por: ${r.autor}</span>
                                <span class="review-date">${r.fecha}</span>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('listaCalificaciones').innerHTML = html;
        }

        cargarCalificaciones();
    </script>
</body>
</html>
